<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DigitalHut Living Ecosystem</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:
radial-gradient(circle at top left,#082f49,#020617 60%);
color:white;
padding:30px;
}

h1{
font-size:52px;
margin-bottom:10px;
}

.sim-nav{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px;
margin:30px 0;
}

.sim-nav button{
padding:18px;
border:0;
border-radius:18px;
background:#38bdf8;
font-size:22px;
font-weight:bold;
color:#020617;
}

.scene{
background:#0f172a;
border-radius:30px;
padding:24px;
border:1px solid #38bdf8;
box-shadow:0 0 30px #38bdf833;
min-height:420px;
position:relative;
overflow:hidden;
}

.signal{
position:absolute;
top:20px;
right:20px;
background:#020617cc;
border:1px solid #38bdf8;
padding:10px;
border-radius:14px;
font-size:13px;
}

.orb{
position:absolute;
width:18px;
height:18px;
border-radius:50%;
background:#38bdf8;
right:24px;
bottom:24px;
box-shadow:0 0 25px #38bdf8;
animation:pulse 2s infinite;
}

.badge{
display:inline-block;
padding:10px 14px;
background:#22c55e;
color:#020617;
font-weight:bold;
border-radius:999px;
margin:8px;
}

.hotspot{
background:#111827;
border:1px solid #38bdf8;
padding:18px;
border-radius:20px;
margin-top:18px;
}

@keyframes pulse{
0%,100%{
transform:scale(1);
opacity:.5;
}
50%{
transform:scale(1.6);
opacity:1;
}
}

</style>
</head>

<body>

<h1>Interactive Living Ecosystem Simulator</h1>

<p>
DigitalHut operational simulator environment.
</p>

<div class="sim-nav">

<button onclick="loadScene('Exterior')">Exterior</button>
<button onclick="loadScene('Lobby')">Lobby</button>
<button onclick="loadScene('Living Room')">Living Room</button>
<button onclick="loadScene('Patio')">Patio</button>
<button onclick="loadScene('Pool')">Pool</button>
<button onclick="loadScene('Office')">Office</button>
<button onclick="loadScene('Safe Room')">Safe Room</button>
<button onclick="loadScene('Rooftop')">Rooftop</button>

</div>

<div id="scene" class="scene"></div>

<script>

const scenes = {

Exterior:{
desc:"Neighborhood traffic, highways, birds, curb appeal.",
people:["Family arriving","Neighbor walking","Delivery driver"],
signal:"Exterior routing active"
},

Lobby:{
desc:"Commercial guest reception and presentation systems.",
people:["Reception guest","Business owner","Plant installer"],
signal:"Commercial traffic rising"
},

"Living Room":{
desc:"Smart-home family interaction environment.",
people:["Parent relaxing","Child playing","Guest visiting"],
signal:"Lifestyle simulation active"
},

Patio:{
desc:"Outdoor greenery and hospitality routing.",
people:["Family cooking","Guest sitting","Landscape crew"],
signal:"Outdoor activity detected"
},

Pool:{
desc:"Poolside tropical ecosystem interaction.",
people:["Swimmer","Guest lounging","Service tech"],
signal:"Hospitality traffic active"
},

Office:{
desc:"Creator economy and AI workflow simulation.",
people:["Manager","Client","Remote worker"],
signal:"Business workflow active"
},

"Safe Room":{
desc:"Protected operational planning layer.",
people:["Security lead","Planner"],
signal:"Security systems online"
},

Rooftop:{
desc:"Collaboration and skyline networking.",
people:["Creator","Investor","Designer"],
signal:"Collaboration signals detected"
}

};

function loadScene(name){

const s = scenes[name];

document.getElementById("scene").innerHTML = `

<div class="signal">${s.signal}</div>

<h2>${name}</h2>

<p>${s.desc}</p>

<h3>Simulated Occupants</h3>

${s.people.map(p=>`<span class="badge">${p}</span>`).join("")}

<div class="hotspot">

<h3>Dojj Reading</h3>

<p>
Environment active for:
product discovery,
operational routing,
AI interaction,
and immersive commerce simulation.
</p>

</div>

<div class="orb"></div>

`;

}

loadScene("Exterior");

</script>

</body>
</html>

<style>

.overlay{
position:fixed;
inset:0;
background:#000000dd;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
padding:20px;
box-sizing:border-box;
}

.overlay-card{
background:#0f172a;
border:1px solid #38bdf8;
border-radius:30px;
padding:24px;
width:100%;
max-width:700px;
box-shadow:0 0 40px #38bdf855;
animation:fadeIn .3s ease;
}

.overlay-card h2{
margin-top:0;
}

.overlay-close{
margin-top:20px;
background:#ef4444;
border:0;
padding:14px;
border-radius:14px;
color:white;
font-weight:bold;
width:100%;
}

.metric{
margin-top:14px;
padding:12px;
border-radius:14px;
background:#111827;
border:1px solid #38bdf8;
}

@keyframes fadeIn{
from{
opacity:0;
transform:scale(.95);
}
to{
opacity:1;
transform:scale(1);
}
}

</style>

<script>

const hotspotIntel = {

"Family arriving":{
title:"Residential Arrival Pattern",
desc:"Family ecosystem detected entering residential environment.",
metrics:[
"Household engagement rising",
"Exterior attraction score: 84%",
"Patio interest probability: High",
"Landscape compatibility: Active"
]
},

"Neighbor walking":{
title:"Neighborhood Activity Signal",
desc:"Pedestrian movement generating passive environmental visibility.",
metrics:[
"Community activity increasing",
"Curb appeal exposure active",
"Foot-traffic simulation online",
"Visibility radius expanding"
]
},

"Delivery driver":{
title:"Commerce Routing Layer",
desc:"Operational delivery route connected to product movement systems.",
metrics:[
"Product routing active",
"Marketplace synchronization enabled",
"Delivery frequency: Medium",
"Future commerce signal detected"
]
},

"Reception guest":{
title:"Commercial Entry Signal",
desc:"Business interaction environment activated.",
metrics:[
"Commercial opportunity detected",
"Presentation layer active",
"Operational engagement increasing"
]
},

"Manager":{
title:"AI Workflow Oversight",
desc:"Business management and AI routing environment active.",
metrics:[
"Operational systems stable",
"Client workflow synchronized",
"Creator economy linkage active"
]
}

};

document.addEventListener("click",e=>{

if(
e.target.classList.contains("badge")
){

const txt =
e.target.innerText.trim();

const intel =
hotspotIntel[txt];

if(!intel) return;

const overlay =
document.createElement("div");

overlay.className =
"overlay";

overlay.innerHTML = `

<div class="overlay-card">

<h2>${intel.title}</h2>

<p>${intel.desc}</p>

${intel.metrics.map(m=>`
<div class="metric">${m}</div>
`).join("")}

<button class="overlay-close">
Close
</button>

</div>

`;

overlay.onclick = (ev)=>{

if(
ev.target.classList.contains("overlay") ||
ev.target.classList.contains("overlay-close")
){
overlay.remove();
}

};

document.body.appendChild(
overlay
);

}

});

</script>
