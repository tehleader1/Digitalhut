<!DOCTYPE html>
<html>
<head>
  <title>DigitalHut</title>

  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: Arial;
      padding: 40px;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 12px;
    }

    a {
      color: #38bdf8;
      text-decoration: none;
    }

    h1 {
      font-size: 42px;
    }

    .error {
      color: red;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<h1>🚀 DigitalHut</h1>

<p>Live AI Product Marketplace</p>

<div id="products"></div>

<div id="error" class="error"></div>

<script>

async function loadProducts() {

  try {

    const response = await fetch(
      "https://api.digitalhut.app/api/producthunt/listings"
    );

    const data = await response.json();

    console.log(data);

    const posts = data.data.posts.edges;

    document.getElementById("products").innerHTML =
      posts.map(post => {

        const p = post.node;

        return `
          <div class="card">

            <h2>${p.name}</h2>

            <p>${p.tagline}</p>

            <p>👍 ${p.votesCount}</p>

            <a href="${p.url}" target="_blank">
              View Product
            </a>

          </div>
        `;

      }).join("");

  } catch (error) {

    console.log(error);

    document.getElementById("error").innerHTML =
      error.toString();

  }

}

loadProducts();

</script>

</body>
</html>
