<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DigitalHut Unreal Simulation Engine</title>
<style>
body{margin:0;background:#020617;color:white;font-family:Arial;padding:24px}
h1{font-size:42px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
button{background:#38bdf8;border:0;border-radius:18px;padding:18px;font-size:20px;font-weight:800}
#viewport{margin-top:25px;height:520px;border:1px solid #38bdf8;border-radius:30px;background:radial-gradient(circle at center,#0f172a,#020617);position:relative;overflow:hidden;box-shadow:0 0 35px #38bdf844}
.cluster{position:absolute;border-radius:10px;background:#38bdf8;box-shadow:0 0 18px #38bdf8aa;transition:.4s}
.panel{background:#0f172a;border:1px solid #38bdf8;border-radius:22px;padding:18px;margin-top:18px}
.metric{background:#111827;margin:10px 0;padding:12px;border-radius:12px}
.light{position:absolute;border-radius:50%;background:#fde68a;filter:blur(12px);opacity:.65}
</style>
</head>
<body>

<h1>DigitalHut Unreal-Style Simulation Engine</h1>
<p>Nanite-inspired cluster culling + Lumen-inspired lighting + deferred simulation logic.</p>

<div class="grid">
<button onclick="runScene('Exterior')">Exterior</button>
<button onclick="runScene('Lobby')">Lobby</button>
<button onclick="runScene('Living Room')">Living Room</button>
<button onclick="runScene('Patio')">Patio</button>
<button onclick="runScene('Pool')">Pool</button>
<button onclick="runScene('Office')">Office</button>
</div>

<div id="viewport"></div>

<div class="panel">
<h2 id="sceneTitle">Scene Pipeline</h2>
<div id="readout"></div>
</div>

<script>
const scenes={
Exterior:["house","road","bird","neighbor","delivery"],
Lobby:["desk","guest","plant","lighting","route"],
"Living Room":["sofa","family","screen","table","ambient"],
Patio:["plants","grill","guest","sun","commerce"],
Pool:["water","chair","guest","reflection","motion"],
Office:["desk","manager","client","ai","workflow"]
};

function naniteClusterCulling(objects){
return objects.map((o,i)=>({
name:o,
cluster:i+1,
triangles:Math.floor(Math.random()*9000)+1000,
visible:Math.random()>.22,
lod:Math.random()>.5?"pixel-detail":"reduced",
screenCost:Math.floor(Math.random()*100)
}));
}

function lumenLighting(clusters){
return clusters.filter(c=>c.visible).map(c=>({
target:c.name,
bounceLight:Math.floor(Math.random()*70)+30,
reflection:Math.floor(Math.random()*60)+20,
surfaceCache:"active"
}));
}

function deferredPass(clusters,lights){
return {
gBuffer:clusters.length+" material entries",
visibleClusters:clusters.filter(c=>c.visible).length,
lightingPass:lights.length+" surfaces lit",
postProcess:"ACES tone map + motion smoothing",
dojjScore:Math.floor(Math.random()*18)+82
};
}

function renderClusters(clusters){
const vp=document.getElementById("viewport");
vp.innerHTML="";
clusters.forEach(c=>{
if(!c.visible)return;
let el=document.createElement("div");
el.className="cluster";
el.style.left=Math.random()*82+"%";
el.style.top=Math.random()*78+"%";
el.style.width=(30+Math.random()*65)+"px";
el.style.height=(30+Math.random()*65)+"px";
el.innerText=c.name;
el.style.fontSize="11px";
el.style.padding="6px";
vp.appendChild(el);
});
let light=document.createElement("div");
light.className="light";
light.style.width="130px";
light.style.height="130px";
light.style.left="60%";
light.style.top="12%";
vp.appendChild(light);
}

function runScene(name){
const clusters=naniteClusterCulling(scenes[name]);
const lights=lumenLighting(clusters);
const frame=deferredPass(clusters,lights);
renderClusters(clusters);

document.getElementById("sceneTitle").innerText=name+" Rendering Pipeline";

document.getElementById("readout").innerHTML=`
<div class="metric"><b>Nanite Cluster Culling:</b> ${frame.visibleClusters}/${clusters.length} clusters visible</div>
<div class="metric"><b>G-Buffer Pass:</b> ${frame.gBuffer}</div>
<div class="metric"><b>Lumen Lighting:</b> ${frame.lightingPass}</div>
<div class="metric"><b>Post Process:</b> ${frame.postProcess}</div>
<div class="metric"><b>Dojj Simulation Score:</b> ${frame.dojjScore}%</div>
<h3>Active Clusters</h3>
${clusters.map(c=>`<div class="metric">${c.name} | cluster ${c.cluster} | ${c.triangles} tris | ${c.visible?"VISIBLE":"CULLED"} | ${c.lod}</div>`).join("")}
`;
}

runScene("Exterior");
</script>

</body>
</html>
