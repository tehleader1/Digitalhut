name: digitalhut-social

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      mixpost:
        condition: service_started
    environment:
      SOCIAL_HOST: ${SOCIAL_HOST}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, social]

  mixpost:
    image: inovector/mixpost@sha256:60460addcafbb9da40fb3236ecde6108534149c54b65c8dc03298fc47faf53bb
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: DigitalHut Social Operations
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: https://${SOCIAL_HOST}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: mixpost
      DB_USERNAME: mixpost
      DB_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PREFIX: digitalhut_social_database_
      MIXPOST_CACHE_PREFIX: digitalhut_social
      MIXPOST_DISK: public
      SESSION_COOKIE: digitalhut_social_session
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-null}
      MAIL_FROM_ADDRESS: developer-anthony@digitalhut.app
      MAIL_FROM_NAME: DigitalHut Social Operations
    volumes:
      - mixpost_media:/var/www/html/storage/app/public
      - ./digitalhut-auto-enqueue.php:/var/www/html/digitalhut-auto-enqueue.php:ro
      - ./custom/app.blade.php:/var/www/html/vendor/inovector/mixpost/resources/views/app.blade.php:ro
      - ./custom/web.php:/var/www/html/routes/web.php:ro
    networks: [social]

  mysql:
    image: mysql/mysql-server:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: mixpost
      MYSQL_USER: mixpost
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [social]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks: [social]

networks:
  edge:
  social:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  mixpost_media:
  mysql_data:
  redis_data:
