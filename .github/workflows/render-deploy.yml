name: Deploy to Render

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy-render:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm Render deploy hook is configured
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not configured. Add the Render deploy hook URL as a GitHub Actions secret."
            exit 1
          fi

      - name: Trigger Render deploy
        run: |
          curl --fail --silent --show-error --request POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
